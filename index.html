<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Peaje IoT</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #00e676; margin-bottom: 5px; }
        .card { background-color: #1e1e1e; border-radius: 12px; padding: 20px; margin: 15px auto; max-width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .valor { font-size: 2em; font-weight: bold; color: #00b0ff; margin: 10px 0; }
        .estado { font-size: 1.2em; font-weight: bold; padding: 10px; border-radius: 6px; display: inline-block; background-color: #2c2c2c; }
        .btn { border: none; padding: 12px 24px; font-size: 1em; font-weight: bold; border-radius: 8px; cursor: pointer; margin: 8px; transition: 0.2s; }
        .btn-abrir { background-color: #00c853; color: white; }
        .btn-cerrar { background-color: #ff3d00; color: white; }
        .btn-reset { background-color: #ffab00; color: black; }
        .btn:hover { opacity: 0.8; }
    </style>
    <script>
        function actualizarDatos() {
            fetch('/estado')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('contador').innerText = data.contador;
                    document.getElementById('uid').innerText = data.uid;
                    document.getElementById('estado').innerText = data.estado;
                });
        }
        setInterval(actualizarDatos, 1000);
    </script>
</head>
<body>
    <h1>Estación de Peaje IoT</h1>
    <p>Sistema de Telepase y Control de Tránsito</p>

    <div class="card">
        <h3>Vehículos Procesados</h3>
        <div id="contador" class="valor">0</div>
    </div>

    <div class="card">
        <h3>Última Tarjeta Telepase (UID)</h3>
        <div id="uid" class="valor" style="font-size: 1.3em; color: #e0e0e0;">Ninguno</div>
    </div>

    <div class="card">
        <h3>Estado del Carril</h3>
        <div id="estado" class="estado">ESPERANDO VEHICULO</div>
    </div>

    <div class="card">
        <h3>Control Manual Operativo</h3>
        <button class="btn btn-abrir" onclick="fetch('/abrir')">Apertura Manual</button>
        <button class="btn btn-cerrar" onclick="fetch('/emergencia')">Bloqueo Emergencia</button>
        <button class="btn btn-reset" onclick="fetch('/reset')">Reset Contador</button>
    </div>
</body>
</html>
